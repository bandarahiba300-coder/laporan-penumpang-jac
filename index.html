<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laporan Penumpang JAC</title>
<style>
:root{--warna:#2563eb}
body.depok{--warna:#2563eb}
body.bandara{--warna:#16a34a}
body{font-family:sans-serif;background:#f0f4ff;margin:0;padding:10px}
.card{background:#fff;border-radius:16px;padding:14px;max-width:780px;margin:auto;box-shadow:0 4px 12px rgba(0,0,0,.1)}
h2{text-align:center;color:var(--warna);margin:0 0 4px;font-size:22px}
p.sub{text-align:center;color:#666;font-size:13px;margin:0 0 12px}
label{font-size:13px;font-weight:bold;display:block;margin-top:10px}
input,select{width:100%;padding:10px;border:1px solid #ddd;border-radius:10px;margin-top:5px;box-sizing:border-box;font-size:15px}
input:focus,select:focus{outline:2px solid var(--warna)}
button{width:100%;padding:12px;border:none;border-radius:12px;background:var(--warna);color:#fff;font-weight:bold;font-size:15px;margin-top:14px}
.hint{font-size:11px;color:#888;margin-top:4px}
h3{margin:22px 0 8px;text-align:center;font-size:16px}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{border:1px solid #999;padding:6px;text-align:center}
th.depok{background:#5aa9e6;color:#000}
th.bandara{background:#6fbf6f;color:#000}
th.sub-depok{background:#8ec5f0;color:#000}
th.sub-bandara{background:#9ad39a;color:#000}
td.depok{background:#eaf4ff}
td.bandara{background:#eefbee}
.total-box{display:flex;gap:8px;margin-top:10px}
.total-box div{flex:1;text-align:center;padding:10px;border-radius:10px;font-weight:bold;font-size:13px}
.t-depok{background:#dbeafe;color:#1e3a8a}
.t-bandara{background:#dcfce7;color:#166534}
.t-all{background:#1e3a8a;color:#fff}
.badge{display:inline-block;padding:4px 10px;border-radius:20px;background:var(--warna);color:#fff;font-size:11px;font-weight:bold}
</style>
</head>
<body class="depok">
<div class="card">
<h2>Laporan Penumpang JAC</h2>
<p class="sub">Bandara HIBA - Input Harian &nbsp;<span class="badge" id="badgeRute">DEPOK - BIRU</span></p>

<label>Tanggal</label>
<input type="date" id="tanggal">
<label>Rute / Trayek</label>
<select id="rute" onchange="gantiRute()">
<option value="Depok">1. Depok</option>
<option value="Bandara">2. Bandara</option>
</select>
<label>Jam Keberangkatan</label>
<input type="text" id="jam" list="listJam" placeholder="Ketik jam / pilih">
<datalist id="listJam"></datalist>
<div class="hint">Bisa diketik manual. Nanti di tabel otomatis urut dari jam terkecil. 0:20 = 24:20 (paling akhir).</div>
<label>No. Body Bus</label>
<input type="text" id="body" placeholder="Contoh: A60">
<label>Jumlah Penumpang</label>
<input type="number" id="penumpang" placeholder="0">
<label>Keterangan</label>
<input type="text" id="ket" placeholder="Opsional">
<button onclick="tambah()">+ Tambah Laporan</button>
<button onclick="hapusSemua()" style="background:#ef4444;margin-top:8px">Hapus Semua</button>

<h3>📋 REKAPAN - DEPOK & BANDARA DIGABUNG</h3>
<table>
<thead>
<tr><th rowspan="2">No</th><th class="depok" colspan="3">DEPOK</th><th class="bandara" colspan="3">BANDARA</th></tr>
<tr><th class="sub-depok">No.Body</th><th class="sub-depok">Jam</th><th class="sub-depok">Jml Pnp</th><th class="sub-bandara">No.Body</th><th class="sub-bandara">Jam</th><th class="sub-bandara">Jml Pnp</th></tr>
</thead>
<tbody id="list"></tbody>
</table>

<div class="total-box">
<div class="t-depok" id="totDepok">Depok: 0</div>
<div class="t-bandara" id="totBandara">Bandara: 0</div>
<div class="t-all" id="totAll">Total: 0</div>
</div>
</div>

// LOGIKA URUT JAM: 0:20 dianggap 24:20, jadi paling besar / paling akhir
function nilaiJam(jamStr){
  let parts = jamStr.split(':');
  let h = parseInt(parts[0],10);
  let m = parseInt(parts[1]||'0',10);
  if(h===0) h=24; // 0:20 -> 24:20
  return h*60 + m;
}
function urutJam(a,b){ return nilaiJam(a.jam) - nilaiJam(b.jam); }

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laporan Penumpang JAC</title>
<style>
body{font-family:sans-serif;background:#f0f4ff;margin:0;padding:16px}
.card{background:#fff;border-radius:16px;padding:16px;max-width:500px;margin:auto;box-shadow:0 4px 12px rgba(0,0,0,.1)}
h2{text-align:center;color:#1e3a8a;margin:0 0 4px}
p.sub{text-align:center;color:#666;font-size:13px;margin:0 0 16px}
label{font-size:13px;font-weight:bold;display:block;margin-top:12px}
input,select{width:100%;padding:11px;border:1px solid #ddd;border-radius:10px;margin-top:5px;box-sizing:border-box;font-size:15px}
button{width:100%;padding:13px;border:none;border-radius:12px;background:#1e3a8a;color:#fff;font-weight:bold;font-size:16px;margin-top:18px}
table{width:100%;border-collapse:collapse;margin-top:16px;font-size:13px}
th,td{border:1px solid #ddd;padding:8px;text-align:left}
th{background:#1e3a8a;color:#fff}
.total{margin-top:12px;font-weight:bold;text-align:right}
</style>
</head>
<body>
<div class="card">
<h2>🚌 Laporan Penumpang JAC</h2>
<p class="sub">Bandara HIBA - Input Harian</p>

<label>Tanggal</label>
<input type="date" id="tanggal">
<label>Rute / Trayek</label>
<select id="rute">
<option>Bandara Soetta - Gambir</option>
<option>Bandara Soetta - Kampung Rambutan</option>
<option>Bandara Soetta - Bogor</option>
<option>Bandara Soetta - Bekasi</option>
<option>Bandara Halim - Gambir</option>
</select>
<label>Nama Driver / Nopol</label>
<input type="text" id="driver" placeholder="Contoh: Budi / B 1234 XYZ">
<label>Jumlah Penumpang</label>
<input type="number" id="penumpang" placeholder="0">
<label>Keterangan</label>
<input type="text" id="ket" placeholder="Opsional">

<button onclick="tambah()">+ Tambah Laporan</button>
<button onclick="hapusSemua()" style="background:#ef4444;margin-top:8px">Hapus Semua</button>

<table>
<thead><tr><th>Tanggal</th><th>Rute</th><th>Driver</th><th>Pnp</th><th></th></tr></thead>
<tbody id="list"></tbody>
</table>
<div class="total" id="total">Total Penumpang: 0</div>
</div>

<script>
let data = JSON.parse(localStorage.getItem('jac')||'[]');
function render(){
  let h=''; let tot=0;
  data.forEach((d,i)=>{
    tot+=Number(d.pnp);
    h+=`<tr><td>${d.tgl}</td><td>${d.rute}</td><td>${d.driver}</td><td>${d.pnp}</td><td><button onclick="hapus(${i})" style="background:#ef4444;padding:5px;margin:0">x</button></td></tr>`;
  });
  document.getElementById('list').innerHTML=h;
  document.getElementById('total').innerText='Total Penumpang: '+tot;
}
function tambah(){
  let tgl=document.getElementById('tanggal').value;
  let rute=document.getElementById('rute').value;
  let driver=document.getElementById('driver').value;
  let pnp=document.getElementById('penumpang').value;
  if(!tgl||!pnp){alert('Isi tanggal & penumpang dulu Aa');return;}
  data.push({tgl,rute,driver,pnp});
  localStorage.setItem('jac',JSON.stringify(data));
  document.getElementById('penumpang').value='';
  render();
}
function hapus(i){data.splice(i,1);localStorage.setItem('jac',JSON.stringify(data));render();}
function hapusSemua(){if(confirm('Hapus semua?')){data=[];localStorage.removeItem('jac');render();}}
document.getElementById('tanggal').value=new Date().toISOString().slice(0,10);
render();
</script>
</body>
</html>

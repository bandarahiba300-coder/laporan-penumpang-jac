<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAPORAN PENUMPANG JAC HIBA UTAMA</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#fff;padding:8px}
h1{text-align:center;font-size:19px;font-weight:900;margin:6px 0 14px}
.top{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;margin-bottom:20px}
.box{border:2px solid #000;text-align:center;margin:0 3px}
.box .head{border-bottom:2px solid #000;font-weight:900;font-size:17px;padding:8px 2px}
.box .big{font-size:34px;font-weight:900;padding:16px 2px;min-height:75px}
.box .sub{border-top:2px solid #000;font-weight:900;padding:7px 2px;font-size:15px}
.box .sub-val{font-size:22px;font-weight:900;padding:7px 2px;min-height:40px;border-top:1px solid #000}
label{display:block;font-size:17px;border:2px solid #000;border-bottom:none;padding:7px}
input,select{width:100%;border:2px solid #000;border-top:none;padding:12px;font-size:17px;margin-bottom:18px;outline:none}
.btn{width:100%;padding:14px;border:2px solid #000;background:#000;color:#fff;font-weight:900;font-size:17px}
.btn2{width:100%;padding:12px;border:2px solid #000;background:#fff;font-weight:900;font-size:14px;margin-top:8px}
.item{border:2px solid #000;padding:10px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.del{color:red;font-weight:900;border:none;background:none;font-size:20px}
</style>
</head>
<body>
<h1>LAPORAN PENUMPANG JAC HIBA UTAMA</h1>

<div class="top">
  <div class="box"><div class="head">DEPOK</div><div class="big" id="angkaDepok">0</div><div class="sub">Dari Limo</div><div class="sub-val" id="angkaDariLimo">0</div></div>
  <div class="box"><div class="head">BANDARA</div><div class="big" id="angkaBandara">0</div><div class="sub">Ke Limo</div><div class="sub-val" id="angkaKeLimo">0</div></div>
  <div class="box"><div class="head">TOTAL</div><div class="big" id="angkaTotal">0</div><div class="sub">Total</div><div class="sub-val" id="angkaRit">0</div></div>
</div>

<label>Tanggal</label>
<input type="date" id="tgl" style="border-bottom:2px solid #000">

<label>PILIH RUTE</label>
<select id="rute">
<option>DEPOK - BANDARA</option>
<option>BANDARA - DEPOK</option>
<option>DARI LIMO</option>
<option>KE LIMO</option>
</select>

<label>No.Body Bus</label>
<input type="text" id="body" placeholder="A68">

<label>Jam Keberangkatan</label>
<input type="time" id="jam">

<label>Jumlah Penumpang</label>
<input type="number" id="pnp" placeholder="0">

<button class="btn" onclick="tambah()">SIMPAN</button>
<button class="btn2" onclick="kirimWA()">KIRIM KE WA</button>

<div id="list" style="margin-top:16px"></div>

<script>
let data = JSON.parse(localStorage.getItem('jac')||'[]');
document.getElementById('tgl').valueAsDate = new Date();
function tambah(){
  let rute=document.getElementById('rute').value;
  let body=document.getElementById('body').value.trim().toUpperCase();
  let jam=document.getElementById('jam').value;
  let pnp=parseInt(document.getElementById('pnp').value||0);
  let tgl=document.getElementById('tgl').value;
  if(!body||!jam||!pnp){alert('Isi semua!');return;}
  data.push({tgl,rute,body,jam,pnp});
  localStorage.setItem('jac',JSON.stringify(data));
  document.getElementById('body').value='';document.getElementById('pnp').value='';
  render();
}
function hapus(i){data.splice(i,1);localStorage.setItem('jac',JSON.stringify(data));render();}
function render(){
  let tgl=document.getElementById('tgl').value;
  let hari=data.filter(d=>d.tgl===tgl);
  let d1=0,b1=0,dl=0,kl=0;
  hari.forEach(x=>{if(x.rute==='DEPOK - BANDARA')d1+=x.pnp;if(x.rute==='BANDARA - DEPOK')b1+=x.pnp;if(x.rute==='DARI LIMO')dl+=x.pnp;if(x.rute==='KE LIMO')kl+=x.pnp;});
  document.getElementById('angkaDepok').innerText=d1;
  document.getElementById('angkaBandara').innerText=b1;
  document.getElementById('angkaDariLimo').innerText=dl;
  document.getElementById('angkaKeLimo').innerText=kl;
  document.getElementById('angkaTotal').innerText=d1+b1+dl+kl;
  document.getElementById('angkaRit').innerText=hari.length+' Rit';
  let list=document.getElementById('list');list.innerHTML='';
  [...hari].reverse().forEach(d=>{
    let idx=data.lastIndexOf(d);
    let div=document.createElement('div');div.className='item';
    div.innerHTML=`<div><b>${d.body} - ${d.jam}</b><br><small>${d.rute}</small></div><div><b>${d.pnp}</b> <button class="del" onclick="hapus(${idx})">×</button></div>`;
    list.appendChild(div);
  });
}
function kirimWA(){
  let txt=`LAPORAN PENUMPANG JAC HIBA UTAMA\nTanggal: ${document.getElementById('tgl').value}\nDEPOK: ${document.getElementById('angkaDepok').innerText} (Dari Limo: ${document.getElementById('angkaDariLimo').innerText})\nBANDARA: ${document.getElementById('angkaBandara').innerText} (Ke Limo: ${document.getElementById('angkaKeLimo').innerText})\nTOTAL: ${document.getElementById('angkaTotal').innerText}`;
  window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank');
}
document.getElementById('tgl').addEventListener('change',render);
render();
</script>
</body>
</html>

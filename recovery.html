<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Recovery</title></head>
<body style="font-family:sans-serif;padding:15px">
<h2>RECOVERY DATA LAMA</h2>
<p id="info">Lagi cek...</p>
<textarea id="hasil" style="width:100%;height:300px"></textarea><br><br>
<button onclick="copyData()" style="padding:12px;width:100%;background:#16a34a;color:#fff;border:none;border-radius:10px;font-weight:bold">SALIN DATA LAMA</button>
<script>
let d = localStorage.getItem('jac') || '[]';
let l = localStorage.getItem('jac_limo') || '{}';
let arr = JSON.parse(d);
document.getElementById('info').innerText = 'Ketemu: ' + arr.length + ' laporan lama! Kalau 0 berarti salah browser.';
document.getElementById('hasil').value = 'DATA:' + d + '\n\nLIMO:' + l;
function copyData(){ document.getElementById('hasil').select(); document.execCommand('copy'); alert('Udah ke-copy! Kirim ke Mita di WA'); }
</script></body></html>

<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Restore REST</title></head>
<body style="font-family:sans-serif;padding:15px;text-align:center">
<h2>RESTORE VIA REST</h2>
<p id="info">Lagi nyoba nyambung...</p>
<p id="err" style="color:red"></p>
<script>
let data=JSON.parse(localStorage.getItem('jac')||'[]');
let limo=JSON.parse(localStorage.getItem('jac_limo')||'{}');
document.getElementById('info').innerText='Ketemu '+data.length+' laporan, lagi upload...';
fetch('https://laporan-jac-baru-default-rtdb.firebaseio.com/laporan.json',{method:'PUT',body:JSON.stringify({data:data,limo:limo})})
.then(r=>r.text()).then(t=>{
  document.getElementById('info').innerText='BERHASIL! 53 data udah masuk Firebase! Buka link utama sekarang!';
  alert('BERHASIL Aa! Cek link utama!');
}).catch(e=>{ document.getElementById('err').innerText='Gagal: '+e.message; });
</script></body></html>

<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Auto Pindah</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head><body style="font-family:sans-serif;padding:15px;text-align:center">
<h2>OTOMATIS PINDAH...</h2>
<p id="info" style="font-size:18px">Tunggu 3 detik, lagi mindahin otomatis...</p>
<p id="err" style="color:red"></p>
<script>
const firebaseConfig={apiKey:"AIzaSyAtnlbo4x3i4IEzSpT_X28zhGT4lSRp1Uw",authDomain:"laporan-jac-baru.firebaseapp.com",databaseURL:"https://laporan-jac-baru-default-rtdb.firebaseio.com",projectId:"laporan-jac-baru",storageBucket:"laporan-jac-baru.firebasestorage.app",messagingSenderId:"893123722329",appId:"1:893123722329:web:3f7d56b5ac0cbddfc0e30d8"};
firebase.initializeApp(firebaseConfig);
let data=JSON.parse(localStorage.getItem('jac')||'[]');
let limo=JSON.parse(localStorage.getItem('jac_limo')||'{}');
document.getElementById('info').innerText='Ketemu '+data.length+' laporan, lagi mindahin... JANGAN TUTUP!';
setTimeout(()=>{
  firebase.database().ref('laporan/data').set(data).then(()=>{
    return firebase.database().ref('laporan/limo').set(limo);
  }).then(()=>{ document.getElementById('info').innerText='BERHASIL! 53 data udah pindah! Buka link utama sekarang!'; alert('BERHASIL Aa!'); }).catch(e=>{ document.getElementById('err').innerText='Gagal: '+e.message; });
},2000);
</script></body></html>
